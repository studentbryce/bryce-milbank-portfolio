<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">OpenMediaVault audit finding summary</title><desc id="desc">Five findings summarised in an academic security audit: default admin credentials critical, unencrypted HTTP critical, anonymous SMB and RPC access high, SMBv1 and signing high, weak password policy high.</desc><rect width="1100" height="560" fill="#0d1821"/><text x="62" y="79" fill="#8de6d3" font-family="monospace" font-size="23" letter-spacing="4">LAB SECURITY AUDIT · 2026</text><text x="62" y="135" fill="#f2f7f7" font-family="Arial,sans-serif" font-weight="bold" font-size="46">OpenMediaVault risk overview</text><text x="62" y="177" fill="#b8ced3" font-family="Arial,sans-serif" font-size="21">Selected findings · academic test environment</text><g font-family="Arial,sans-serif" font-size="23" fill="#f2f7f7"><text x="62" y="256">Default administrator credentials</text><text x="62" y="325">Administrative access over HTTP</text><text x="62" y="394">Anonymous SMB / RPC enumeration</text><text x="62" y="463">Legacy SMBv1 and SMB signing</text><text x="62" y="532">Weak password controls</text></g><g font-family="monospace" font-size="19" text-anchor="middle"><rect x="869" y="223" width="163" height="44" rx="10" fill="#7b2f39"/><text x="950" y="252" fill="white">CRITICAL</text><rect x="869" y="292" width="163" height="44" rx="10" fill="#7b2f39"/><text x="950" y="321" fill="white">CRITICAL</text><rect x="869" y="361" width="163" height="44" rx="10" fill="#866432"/><text x="950" y="390" fill="white">HIGH</text><rect x="869" y="430" width="163" height="44" rx="10" fill="#866432"/><text x="950" y="459" fill="white">HIGH</text><rect x="869" y="499" width="163" height="44" rx="10" fill="#866432"/><text x="950" y="528" fill="white">HIGH</text></g><g stroke="#46606a" stroke-width="1" opacity=".6"><path d="M62 273H1032M62 342H1032M62 411H1032M62 480H1032"/></g></svg>